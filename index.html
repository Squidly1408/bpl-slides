<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applied before first paint so there's no flash of the wrong theme.
      // Kept in sync with src/lib/theme.ts.
      try {
        var t = localStorage.getItem('bpe-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2c4870" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10141d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="BPL Slides — build and present your Big Picture Learning exhibition slideshow, entirely in your browser." />
    <title>BPL Slides</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
